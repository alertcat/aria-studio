app = "aria-pilot"
primary_region = "sin"

[build]

[env]
  ARIA_MODE = "pilot"
  DATA_ROOT = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "aria_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
